<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ONE LINE BATCH LEVEL GENERATOR (A→B HYBRID)</title>
<style>
body { font-family: monospace; background:#f5f5f5; padding:20px; }
textarea { width:100%; height:320px; margin-top:20px; font-family:monospace; }
button { padding:10px 20px; font-size:16px; }
label { margin-right:10px; }
</style>
</head>
<body>

<h2>ONE LINE BATCH LEVEL GENERATOR (A→B HYBRID)</h2>

<label>Start Level: <input id="start" type="number" value="1"></label>
<label>End Level: <input id="end" type="number" value="200"></label>
<button onclick="generateBatch()">GENERATE</button>

<textarea id="output"></textarea>

<script>
function rand(min, max) {
    return Math.random() * (max - min) + min;
}

// Hierholzer で Euler 閉路を生成
function findEulerPath(nodes, edges) {
    const graph = {};
    const used = {};

    for (const n of nodes) graph[n.id] = [];

    for (const [a, b] of edges) {
        graph[a].push(b);
        graph[b].push(a);
        used[`${a}-${b}`] = false;
        used[`${b}-${a}`] = false;
    }

    const start = nodes[0].id;
    const stack = [start];
    const path = [];

    while (stack.length) {
        const v = stack[stack.length - 1];
        const nxt = graph[v].find(n => !used[`${v}-${n}`]);
        if (nxt !== undefined) {
            used[`${v}-${nxt}`] = true;
            used[`${nxt}-${v}`] = true;
            stack.push(nxt);
        } else {
            path.push(stack.pop());
        }
    }
    return path.reverse();
}

// レベルごとの難易度曲線に合わせた生成
function generateLevel(level) {
    // ノード数はレベルに応じて少しずつ増やす（最大8）
    const nodeCount = Math.min(3 + Math.floor(level / 10), 8);

    const nodes = [];
    const edges = [];
    const edgeSet = new Set();

    // ノード配置
    for (let i = 0; i < nodeCount; i++) {
        nodes.push({
            id: i,
            x: Number(rand(0.15, 0.85).toFixed(2)),
            y: Number(rand(0.15, 0.85).toFixed(2))
        });
    }

    // 基本サイクル：0-1-2-…-(n-1)-0
    for (let i = 0; i < nodeCount - 1; i++) {
        edges.push([i, i + 1]);
        edgeSet.add(`${i}-${i+1}`);
        edgeSet.add(`${i+1}-${i}`);
    }
    edges.push([nodeCount - 1, 0]);
    edgeSet.add(`${nodeCount-1}-0`);
    edgeSet.add(`0-${nodeCount-1}`);

    // ---- 難易度曲線に応じた追加構造 ----

    // Level 1〜20：A（基礎）→ サイクルのみ（追加なし）

    // Level 21〜60：A→B 橋渡し → サブ閉路1本
    if (level >= 21 && level <= 60 && nodeCount >= 5) {
        const mid = Math.floor(nodeCount / 2);      // 中央ノード
        const last = nodeCount - 1;                // 最後のノード

        // サブ閉路：0-mid-last-0
        const extraEdges = [
            [0, mid],
            [mid, last],
            [last, 0]
        ];

        for (const [a, b] of extraEdges) {
            if (!edgeSet.has(`${a}-${b}`) && !edgeSet.has(`${b}-${a}`)) {
                edges.push([a, b]);
                edgeSet.add(`${a}-${b}`);
                edgeSet.add(`${b}-${a}`);
            }
        }
    }

    // Level 61〜200：B（少し難しい）→ サブ閉路2本
    if (level >= 61 && nodeCount >= 6) {
        const mid1 = Math.floor(nodeCount / 2);     // 中央1
        const mid2 = Math.floor((nodeCount - 1) / 2); // 中央2
        const last = nodeCount - 1;

        // サブ閉路1：0-mid1-last-0
        const extra1 = [
            [0, mid1],
            [mid1, last],
            [last, 0]
        ];

        // サブ閉路2：1-mid2-(last-1)-1
        const extra2 = [
            [1, mid2],
            [mid2, last - 1],
            [last - 1, 1]
        ];

        for (const [a, b] of extra1.concat(extra2)) {
            if (!edgeSet.has(`${a}-${b}`) && !edgeSet.has(`${b}-${a}`)) {
                edges.push([a, b]);
                edgeSet.add(`${a}-${b}`);
                edgeSet.add(`${b}-${a}`);
            }
        }
    }

    // ここまでの構造は「必ず全ノード偶数次数」になるように設計してあるので、
    // そのまま Euler 閉路を計算して solution にする
    const solution = findEulerPath(nodes, edges);

    return { id: level, nodes, edges, solution };
}

// バッチ生成
function generateBatch() {
    const start = Number(document.getElementById("start").value);
    const end = Number(document.getElementById("end").value);

    let out = "window.LEVELS=[\n";

    for (let lv = start; lv <= end; lv++) {
        const L = generateLevel(lv);
        out += `{id:${L.id},nodes:${JSON.stringify(L.nodes)},edges:${JSON.stringify(L.edges)},solution:${JSON.stringify(L.solution)}},\n`;
    }

    out += "];";
    document.getElementById("output").value = out;
}
</script>

</body>
</html>
