<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ONE LINE LEVEL CHECKER</title>
<style>
body {
    font-family: monospace;
    background: #f5f5f5;
    padding: 20px;
}
#results {
    margin-top: 20px;
}
.level-box {
    padding: 10px 15px;
    margin-bottom: 10px;
    border-radius: 6px;
    cursor: pointer;
}
.level-ok {
    background: #d6f5d6;
    border: 1px solid #7ac27a;
}
.level-error {
    background: #ffd6d6;
    border: 1px solid #d67a7a;
}
.details {
    margin-top: 8px;
    padding-left: 10px;
    display: none;
    white-space: pre-wrap;
}
.summary {
    font-weight: bold;
}
button {
    padding: 10px 20px;
    font-size: 16px;
}
</style>
</head>
<body>

<h2>===============================<br>
ONE LINE LEVEL CHECKER<br>
===============================</h2>

<button onclick="runCheck()">CHECK</button>

<div id="results"></div>

<script src="../data/levels.js"></script>

<script>
// ------------------------------
// チェックロジック（前回版と同じ）
// ------------------------------
function checkData(level) {
    const errors = [];
    const nodeIds = level.nodes.map(n => n.id);
    const uniqueNodeIds = new Set(nodeIds);
    if (uniqueNodeIds.size !== nodeIds.length) {
        errors.push("Node ID が重複しています");
    }
    for (const n of level.nodes) {
        if (n.x < 0 || n.x > 1 || n.y < 0 || n.y > 1) {
            errors.push(`Node ${n.id} の座標が範囲外です`);
        }
    }
    for (const [a, b] of level.edges) {
        if (!uniqueNodeIds.has(a) || !uniqueNodeIds.has(b)) {
            errors.push(`存在しないNodeを線が参照しています: ${a}-${b}`);
        }
    }
    const edgeSet = new Set(level.edges.map(e => e.join("-")));
    if (edgeSet.size !== level.edges.length) {
        errors.push("同じ線が重複しています");
    }
    return errors;
}

function checkConnected(level) {
    const visited = new Set();
    const graph = {};
    for (const n of level.nodes) graph[n.id] = [];
    for (const [a, b] of level.edges) {
        graph[a].push(b);
        graph[b].push(a);
    }
    function dfs(v) {
        visited.add(v);
        for (const nxt of graph[v]) {
            if (!visited.has(nxt)) dfs(nxt);
        }
    }
    dfs(level.nodes[0].id);
    if (visited.size !== level.nodes.length) {
        return ["グラフが1つにつながっていません"];
    }
    return [];
}

function checkEuler(level) {
    const degree = {};
    for (const n of level.nodes) degree[n.id] = 0;
    for (const [a, b] of level.edges) {
        degree[a]++;
        degree[b]++;
    }
    const errors = [];
    for (const id in degree) {
        if (degree[id] % 2 !== 0) {
            errors.push(`Node ${id} の次数が奇数です`);
        }
    }
    return errors;
}

function checkSolution(level) {
    const errors = [];
    const sol = level.solution;
    if (!sol) return ["solution がありません"];
    const edgeSet = new Set(level.edges.map(e => e.join("-")));
    for (let i = 0; i < sol.length - 1; i++) {
        const a = sol[i];
        const b = sol[i + 1];
        if (!edgeSet.has(`${a}-${b}`) && !edgeSet.has(`${b}-${a}`)) {
            errors.push(`solution が存在しない線を使っています: ${a}-${b}`);
        }
    }
    return errors;
}

// ------------------------------
// UI表示
// ------------------------------
function createLevelBox(level, errors) {
    const box = document.createElement("div");
    box.className = "level-box " + (errors.length === 0 ? "level-ok" : "level-error");

    const summary = document.createElement("div");
    summary.className = "summary";
    summary.textContent = errors.length === 0
        ? `Level ${level.id} ✔ OK`
        : `Level ${level.id} ✖ ERROR (${errors.length})`;

    const details = document.createElement("div");
    details.className = "details";
    details.textContent = errors.join("\n");

    box.appendChild(summary);
    box.appendChild(details);

    box.onclick = () => {
        details.style.display = details.style.display === "none" ? "block" : "none";
    };

    return box;
}

// ------------------------------
// Main
// ------------------------------
function runCheck() {
    const results = document.getElementById("results");
    results.innerHTML = "";

    let okCount = 0;
    let errCount = 0;

    for (const level of window.LEVELS) {
        const errors = [
            ...checkData(level),
            ...checkConnected(level),
            ...checkEuler(level),
            ...checkSolution(level)
        ];

        if (errors.length === 0) okCount++;
        else errCount++;

        results.appendChild(createLevelBox(level, errors));
    }

    const summary = document.createElement("div");
    summary.style.marginTop = "20px";
    summary.style.fontWeight = "bold";
    summary.textContent = `OK: ${okCount} / ERROR: ${errCount}`;
    results.appendChild(summary);
}
</script>

</body>
</html>
