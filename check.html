<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Edge Pattern Checker (JSON)</title>
<script src="js/util.js"></script>
<script src="js/checker.js"></script>
<script src="js/pattern_generator_GM.js"></script>
<script src="js/pattern_render.js"></script>
<script src="js/render_game.js"></script>

<style>
body { font-family: sans-serif; padding: 20px; }
button { padding: 10px 20px; font-size: 16px; margin-top: 10px; cursor: pointer; }
pre { background: #f0f0f0; padding: 10px; white-space: pre-wrap; }
</style>
</head>
<body>

<h2>エッジパターン 生成ツール (ギミック対応版)</h2>

<button id="generate50Btn">200問を生成</button>

<div style="margin-top:20px;">
  <button id="prevLevelBtn">戻る</button>
  <button id="nextLevelBtn">次へ</button>
</div>

<div class="level-jump-container" style="display: inline-flex; align-items: center; gap: 8px; margin-top: 10px;">
  <input type="number" id="levelInput" min="1" max="200" placeholder="Lv" style="width: 60px; padding: 4px 8px; text-align: center;">
  <button id="jumpBtn" onclick="jumpToLevel()" style="padding: 4px 12px;">表示</button>
</div>

<div style="margin-top:20px;">
  <button id="regenLayoutBtn">このレベルのレイアウトを再生成</button>
  <button id="acceptLayoutBtn">このレイアウトを採用する</button>
</div>

<h3 id="levelDisplay">LEVEL -</h3>
<canvas id="previewCanvas" width="400" height="400" style="border:1px solid #ccc;margin-top:10px;"></canvas>

<div id="infoPanel" style="display:inline-block; vertical-align:top; margin-left:20px; width:340px; font-size:14px;">
  <h3>Level情報</h3>
  <div><strong>Level:</strong> <span id="infoLevel">-</span></div>

  <h4>Edge Pattern</h4>
  <pre id="infoEdges" style="background:#f7f7f7; padding:10px; max-height: 150px; overflow-y: auto;"></pre>

  <h4>Node Layout</h4>
  <pre id="infoNodes" style="background:#f7f7f7; padding:10px; max-height: 150px; overflow-y: auto;"></pre>
</div>
<br>

<div class="export-buttons" style="margin-top: 20px;">
  <button id="exportEdgePatternsBtn">edgePatterns エクスポート</button>
  <button id="exportNodeLayoutsBtn">nodeLayouts エクスポート</button>
  <button id="exportLevelSchemesBtn">levelSchemes エクスポート</button>
</div>

<hr style="margin: 30px 0;">

<div id="checkToolSection">
  <h2>エッジパターン チェックツール</h2>
  <button id="runCheckBtn">パターンチェック実行</button>
  
  <div id="checkResultOutput" style="margin-top: 10px; font-size: 16px;"></div>

  <div style="display: flex; gap: 20px; margin-top: 15px; align-items: flex-start;">
    <div>
      <canvas id="checkPreviewCanvas" width="300" height="300" style="border: 1px solid #ccc; background: #f9f9f9;"></canvas>
    </div>

    <div style="flex: 1;">
      <strong>クリアパターン一覧:</strong>
      <pre id="clearPathsOutput" style="background: #2d3748; color: #63b3ed; padding: 10px; border-radius: 5px; max-height: 280px; overflow-y: auto; font-family: monospace;"></pre>
    </div>
  </div>
</div>

<script>
let currentLevel = 1;
let layoutDirty = false;
let currentEdges = [];
let currentNodes = [];

document.getElementById("generate50Btn").onclick = () => {
  resetAllGeneratedData();
  MasterGenerator(1, 200);

  currentLevel = 1;
  layoutDirty = false;

  if (edgePatterns["P1"] && nodeLayouts["L1"]) {
    loadLevelPreview(currentLevel);
  } else {
    alert("生成に失敗しました");
    return;
  }

  alert("200問の生成が完了しました！");
};

function loadLevelPreview(level) {
  currentEdges = edgePatterns["P" + level];
  currentNodes = nodeLayouts["L" + level];

  document.getElementById("levelDisplay").textContent = "LEVEL " + level;
  document.getElementById("infoLevel").textContent = level;

  document.getElementById("infoEdges").textContent = JSON.stringify(currentEdges);
  document.getElementById("infoNodes").textContent = JSON.stringify(currentNodes, null, 2);

  if (typeof renderPreviewGame === "function") {
    renderPreviewGame();
  }
}

document.getElementById("nextLevelBtn").onclick = () => {
  if (layoutDirty) { alert("レイアウトが未採用です！"); return; }
  if (currentLevel >= 200) return;
  currentLevel++;
  loadLevelPreview(currentLevel);
};

document.getElementById("prevLevelBtn").onclick = () => {
  if (layoutDirty) { alert("レイアウトが未採用です！"); return; }
  if (currentLevel <= 1) return;
  currentLevel--;
  loadLevelPreview(currentLevel);
};

function jumpToLevel() {
  const input = document.getElementById('levelInput');
  const targetLevel = parseInt(input.value, 10);
  if (isNaN(targetLevel) || targetLevel < 1 || targetLevel > 200) {
    alert('1 ～ 200 のレベル番号を入力してください。');
    return;
  }
  currentLevel = targetLevel;
  loadLevelPreview(currentLevel);
}

// check.html 内の regenLayoutBtn イベントハンドラ部分
document.getElementById("regenLayoutBtn").onclick = () => {
  const levelId = currentLevel;
  const params = difficultyCurve(levelId);

  let isValid = false;
  let newNodes = null, newEdges = null, attempts = 0;

  while (!isValid && attempts < 50) {
    attempts++;
    const warpPairs = generateWarpPairs(params);
    newEdges = EdgePatternGenerator(levelId, params, warpPairs);
    newNodes = NodeLayoutGenerator(levelId, params, warpPairs);
    const scheme = LevelSchemeAssembler(levelId, newEdges, newNodes, params);

    const check = validateSingleLevel(newNodes, newEdges);
    if (check.valid) isValid = true;
  }

  if (isValid) {
    currentEdges = newEdges;
    currentNodes = newNodes;
    document.getElementById("infoEdges").textContent = JSON.stringify(currentEdges);
    document.getElementById("infoNodes").textContent = JSON.stringify(currentNodes, null, 2);
    renderPreviewGame();
    layoutDirty = true;
  } else {
    alert("再生成に失敗しました。再試行してください。");
  }
};

document.getElementById("acceptLayoutBtn").onclick = () => {
  if (!layoutDirty) {
    alert("現在のレイアウトは既に採用済みです。");
    return;
  }
  edgePatterns["P" + currentLevel] = currentEdges;
  nodeLayouts["L" + currentLevel] = currentNodes;
  layoutDirty = false;
  alert(`LEVEL ${currentLevel} のレイアウトを採用しました！`);
};

// JSONダウンロード関数
function downloadJsonFile(filename, content) {
  const blob = new Blob([content], { type: "application/json;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

document.getElementById("exportEdgePatternsBtn").onclick = () => {
  downloadJsonFile("edge-patterns.json", JSON.stringify(edgePatterns, null, 2));
};
document.getElementById("exportNodeLayoutsBtn").onclick = () => {
  downloadJsonFile("node-layouts.json", JSON.stringify(nodeLayouts, null, 2));
};
document.getElementById("exportLevelSchemesBtn").onclick = () => {
  downloadJsonFile("level-schemes.json", JSON.stringify(levelSchemes, null, 2));
};

// チェック実行ボタンの処理
document.getElementById("runCheckBtn").onclick = () => {
  if (!currentEdges || !currentNodes) return;

  // 1. 一筆書き判定
  const result = checkPattern(currentNodes, currentEdges);
  const resultEl = document.getElementById("checkResultOutput");

  if (result.ok) {
    resultEl.innerHTML = `<span style="color: green; font-weight: bold;">【検証 PASS】 一筆書き可能な経路が存在します</span>`;
  } else {
    resultEl.innerHTML = `<span style="color: red; font-weight: bold;">【検証 FAIL】 ${result.reason}</span>`;
  }

  // 2. 解の取得（最大10パターン）
  const paths = findAllEulerPaths(currentNodes, currentEdges, 10);
  const pathContainer = document.getElementById("clearPathsOutput");
  if (paths.length === 0) {
    pathContainer.textContent = "クリア経路は見つかりませんでした。";
  } else {
    const lines = paths.map((p, idx) => `Path ${idx + 1}: ${p.join(" → ")}`);
    pathContainer.textContent = lines.join("\n");
  }

  // 3. サブCanvas（checkPreviewCanvas）の描画
  const canvas = document.getElementById("checkPreviewCanvas");
  if (canvas) {
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // エッジ描画
    currentEdges.forEach(([a, b, opt = {}]) => {
      const na = currentNodes[a];
      const nb = currentNodes[b];
      if (!na || !nb) return;
      ctx.beginPath();
      ctx.moveTo(na.x * canvas.width, na.y * canvas.height);
      ctx.lineTo(nb.x * canvas.width, nb.y * canvas.height);
      ctx.strokeStyle = opt.count === 2 ? "#3182ce" : "#d1d5dc";
      ctx.lineWidth = opt.count === 2 ? 6 : 3;
      ctx.stroke();
    });

    // ノード描画
    currentNodes.forEach((n, idx) => {
      const x = n.x * canvas.width;
      const y = n.y * canvas.height;
      ctx.beginPath();
      ctx.arc(x, y, 9, 0, Math.PI * 2);
      ctx.fillStyle = n.isForbidden ? "#a0aec0" : (n.warpId ? "#805ad5" : "#ef5b46");
      ctx.fill();

      ctx.fillStyle = "#fff";
      ctx.font = "bold 10px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(idx, x, y);
    });
  }
};
</script>
</body>
</html>
